name: Create GitHub Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish tagged binaries
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -d "releases/$VERSION"
          gh release create "$VERSION" "releases/$VERSION/"* \
            --title "xixi $VERSION" \
            --generate-notes \
            --verify-tag
