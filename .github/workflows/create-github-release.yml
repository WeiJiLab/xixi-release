name: Create GitHub Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish tagged binaries
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -d "releases/$VERSION"
          test -f "releases/$VERSION/RELEASE_NOTES.md"
          assets=(
            "releases/$VERSION/xixifree-ai.apk"
            "releases/$VERSION/xixi-Desktop-Node-macOS.dmg"
            "releases/$VERSION/SHA256SUMS.txt"
          )
          if [ -f "releases/$VERSION/xixi-Desktop-Node-macOS-arm64.dmg" ]; then
            assets+=("releases/$VERSION/xixi-Desktop-Node-macOS-arm64.dmg")
          fi
          gh release create "$VERSION" \
            "${assets[@]}" \
            --title "xixi $VERSION" \
            --notes-file "releases/$VERSION/RELEASE_NOTES.md" \
            --verify-tag
